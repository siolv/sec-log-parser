name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        # No pip install: the analyzer is standard library only.
        run: python -m unittest discover -s tests -v

      - name: Verify the CLI end-to-end (no model required)
        run: |
          python parse_logs.py sample_auth.log sample_access.log --no-ai \
            --out /tmp/report.md --json /tmp/findings.json
          test -s /tmp/report.md
          test -s /tmp/findings.json
          grep -q "203.0.113.42" /tmp/report.md
          echo "report and findings generated successfully"
